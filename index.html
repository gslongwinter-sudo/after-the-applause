</style></head><body><section class="intro" id="intro"><div class="intro-inner"><div class="eyebrow">ARCHIVE NO. 008 / PRIVATE COLLECTION</div><h1>After the Applause</h1><h2>공연의 유실물 기록</h2><p>《THE RETURN》 공연 종료 후 수집된 기록물 8점.<br>일부 기록에는 개인적인 내용이 포함되어 있습니다.<br>열람 순서에는 제한이 없습니다.</p><button class="primary" id="enter">기록 열람하기 &nbsp; ↗</button></div></section><main class="site" id="site"><header class="mast"><div><div class="brand">After the Applause</div><small>공연의 유실물 기록</small></div><div class="counter" id="counter">RECORDS 00 / 08</div></header><section class="desk" aria-label="기록물이 놓인 월넛 책상"><button class="object ticket" data-id="ticket" aria-label="01 공연 티켓 열기"><span class="num">01</span><span class="label">ADMIT ONE</span><strong>THE RETURN</strong><small>B / 12 / 08</small></button><button class="object programme" data-id="programme" aria-label="02 프로그램북 열기"><span class="num">02</span><span class="label">OFFICIAL PROGRAMME</span><strong>THE<br>RETURN</strong><small>강비오 · 최정요</small></button><button class="object notes" data-id="notes" aria-label="03 관객의 현장 노트 열기"><span class="num">03</span><strong>concert notes</strong><span class="scribble">K.466 / 음색<br>BWV106 — 두 손</span></button><button class="object receipt1" data-id="receipt1" aria-label="04 꽃집 영수증 첫 번째 열기"><span class="num">04</span><span class="label">FLEUR DU JOUR</span><strong>꽃의 하루</strong><small>₩98,000<br>R-1024-017</small></button><button class="object receipt2" data-id="receipt2" aria-label="05 꽃집 영수증 두 번째 열기"><span class="num">05</span><span class="label">FLEUR DU JOUR</span><strong>꽃의 하루</strong><small>₩102,000<br>R-1024-021</small></button><button class="object envelope" data-id="envelope" aria-label="06 분실물 봉투 열기"><span class="num">06</span><span class="label">LOST & FOUND</span><strong>LF-008</strong><small>미인계 · 보관 중</small></button><button class="object score" data-id="score" aria-label="07 바흐 악보 열기"><span class="num">07</span><span class="label">BWV 106</span><strong>Sonatina</strong><span class="cover-staff" aria-hidden="true"></span><small>Two-hands arrangement<br>copy 02 · p.04</small></button><button class="object log" data-id="log" aria-label="08 무대 운영 일지 열기"><span class="num">08</span><span class="label">STAGE MANAGEMENT</span><strong>공연 종료 후<br>운영 일지</strong><small>SM-08</small></button></section><p class="hint">물건을 눌러 자세히 살펴보세요. &nbsp; · &nbsp; 순서는 자유롭습니다.</p><footer class="footer">THE RETURN — PRIVATE ARCHIVE</footer></main><div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="기록물 상세"><article class="modal" id="modal"><button class="close" id="close" aria-label="닫기">×</button><div id="content"></div></article></div><aside class="discovery hidden" id="discovery"><p>미등록 기록 1건이 발견되었습니다.<br><b>21:38 이후의 무대 기록</b></p><button id="openFinal">기록 확인하기</button></aside><div id="toast" class="toast hidden" role="status"></div><script>
const $=s=>document.querySelector(s);const visited=new Set();let current=null,page=0,flipped=false,opened=false,extracted=false,cardFlip=false;const pages=[`<div class="page cover"><div class="eyebrow" style="color:#8b7b67">OFFICIAL CONCERT PROGRAMME</div><h2>THE<br>RETURN</h2><p>강비오 · 최정요</p></div>`,`<div class="page"><h2>THE RETURN</h2><p>피아니스트 강비오와 지휘자·작곡가 최정요가 한 무대에 오른다.</p><p>관현악곡과 피아노 독주, 협주곡, 창작곡을 거쳐 두 연주자가 하나의 피아노를 공유하는 마지막 작품으로 이어지는 밤.</p><p>서로 다른 위치에서 음악을 만들어 온 두 사람이 다시 함께 선보이는 무대. 《THE RETURN》은 그들의 현재를 만나는 공연이다.</p></div>`,`<div class="page"><h2>Programme</h2><div class="program-row"><span>I</span><div>Saint-Saëns — <i>Danse macabre</i>, Op.40<br><small>최정요 · 지휘</small></div></div><div class="program-row"><span>II</span><div>Beethoven — <i>Moonlight Sonata</i>, I<br><small>강비오 · 피아노</small></div></div><div class="program-row"><span>III</span><div>Mozart — Piano Concerto No.20, K.466<br><small>강비오 · 피아노 / 최정요 · 지휘</small></div></div><p style="text-align:center;font-size:10px;letter-spacing:.2em">INTERMISSION</p><div class="program-row"><span>IV</span><div>최정요 — <i>Nemesis</i>, Piano Concerto<br><small>강비오 · 피아노 / 최정요 · 지휘</small></div></div><div class="program-row"><span>V</span><div>Bach — <i>Actus tragicus</i>, BWV106: Sonatina<br><small>최정요 · 왼손 / 강비오 · 오른손</small></div></div></div>`,`<div class="page"><h2>강비오 <small style="font:11px var(--mono)">/ PIANO</small></h2><p>피아니스트 강비오는 이번 공연에서 베토벤의 독주곡부터 모차르트와 최정요의 협주곡, 마지막 바흐 소나티나까지 서로 다른 형식의 작품을 선보인다.</p><hr><p class="sub">Q. 이번 공연에서 가장 기대되는 순간은?</p><p>“공연 끝나고요.”</p><p class="sub">Q. 공연이 끝난 뒤요?</p><p>“네. 그때까지 잘해야죠.”</p></div>`,`<div class="page"><h2>최정요 <small style="font:11px var(--mono)">/ CONDUCTOR · COMPOSER · PIANO</small></h2><p>최정요는 이번 공연에서 생상스와 모차르트, 자신의 협주곡 <i>Nemesis</i>를 지휘하고 마지막 무대에서는 강비오와 함께 피아노 앞에 앉는다.</p><hr><p class="sub">Q. 이번 공연에서 특별히 기대하는 작품이 있나요?</p><p>“마지막 곡이요.”</p><p class="sub">Q. 이유가 있을까요?</p><p>“오래 연습했으니까요.”</p></div>`,`<div class="page"><h2>Programme Notes</h2><h3>Danse macabre</h3><p>극적인 관현악의 색채로 공연을 연다.</p><h3>Moonlight Sonata, I</h3><p>절제된 움직임과 지속되는 리듬 속 섬세한 음색과 호흡.</p><h3>Mozart K.466</h3><p>피아노와 오케스트라 사이의 긴밀한 대화.</p><h3>Nemesis</h3><p>작곡가 최정요가 직접 지휘하는 피아노 협주곡.</p><h3>BWV106: Sonatina</h3><p>이번 공연을 위해 준비된 투핸즈 편곡. 최정요의 왼손과 강비오의 오른손이 하나의 연주를 완성한다.</p></div>`,`<div class="page"><h2>Before the Concert</h2><p class="sub">사전 예매 관객에게 받은 짧은 기대평</p><p>“두 사람이 다시 함께하는 무대라니. 예매 공지가 뜨자마자 기다렸습니다.”</p><hr><p>“<i>Nemesis</i>를 강비오의 연주로 듣는다는 게 가장 기대돼요.”</p><hr><p>“마지막 바흐 편곡이 궁금해요. 두 사람이 각자 한 손씩 연주한다는 게 어떤 느낌일지.”</p></div>`,`<div class="page cover"><div class="eyebrow" style="color:#8b7b67">THE RETURN</div><p style="font-size:18px;line-height:2.2;margin:60px 0">음악이 끝난 뒤에도,<br>무대에는 잠시 빛이 남는다.</p><div class="sub">PROGRAMME · END</div></div>`];
const notePages=[`<div class="note-page note-leaf"><h3>I. Saint-Saëns / Danse macabre</h3><p>도입부 정적 길게. 첫 바이올린 진입 좋음.</p><p>왈츠 리듬이 생각보다 무겁지 않다. 목관이 잘 들림.</p><p>후반 템포 ↑, 그런데 음형은 선명. 정요 지휘 상당히 절제됨.</p></div>`,`<div class="note-page note-leaf"><h3>II. Beethoven / Op.27-2, I</h3><p>비오. 시작 템포 예상보다 느림.</p><p>셋잇단음표가 기계적으로 들리지 않음. 상성부 선율을 지나치게 부각하지 않는 쪽.</p><p>저음 잔향이 조금 길다. 페달 때문인지 홀 때문인지?</p><p>마지막 화음 이후 정적 좋았음.</p></div>`,`<div class="note-page note-leaf"><h3>III. Mozart / K.466</h3><p>오케 도입부 긴장감 좋음. 현악이 다소 건조하게 들림.</p><p>독주 진입 이후 소리의 밀도가 확 달라짐.</p><p>2악장 — 비오의 프레이즈 끝 처리가 섬세함. 목관과 주고받는 부분 특히.</p><p>3악장 — 정요가 독주 쪽을 자주 봄. 큐가 정확하다.</p><p>둘 사이 호흡은 확실히 오래 맞춰본 사람들 같다.</p></div>`,`<div class="note-page note-leaf"><h3>IV. Choi Jeongyo / Nemesis</h3><p>초연 때와 비교해 보고 싶다. 악보가 없으니 정확한 판단은 어려움.</p><p>독주와 관현악의 대비가 강함. 저음부 리듬이 계속 긴장을 만듦.</p><p>비오 타건 강한데 소리가 뭉개지지 않는다.</p><p>중간의 조용해지는 부분 — 오케가 완전히 물러나지 않고 긴장 유지.</p><p>종결 직전 몰아가는 느낌. 끝나고 박수까지 잠깐 공백.</p></div>`,`<div class="note-page note-leaf"><h3>V. Bach / BWV106, Sonatina</h3><p>정요 LH / 비오 RH. 투핸즈 편곡.</p><p>두 사람의 터치 차이가 예상보다 뚜렷함. 그런데 연결은 자연스럽다.</p><p>템포를 억지로 맞추는 느낌이 없다. 서로의 음이 끝나는 자리를 정확히 아는 듯.</p><p>중간에 비오가 정요 쪽을 봄. 정요는 건반에서 시선 안 뗌.</p><p>마지막 곡의 끝부분. 비오가 오른손을 먼저 건반에서 뗐다. 정요는 왼손으로 마지막 음을 혼자 눌렀다. 두 사람이 함께 시작한 곡인데, 마지막에는 한 사람의 소리만 남았다.</p><p>박수 시작되고 나서야 서로 봄.</p></div>`,`<div class="note-page note-leaf"><h3>종연 후 · 연필로 추가</h3><p class="pencil">마지막 바흐가 계속 생각난다.</p><p class="pencil">기술적으로는 두 사람의 차이가 분명히 들렸는데, 이상하게 한 사람이 연주하는 것처럼 느껴졌다.</p><p class="pencil">박수가 조금만 늦게 시작됐으면 좋았을 텐데.</p></div>`];
const order1=`<p class="hand">흰 꽃 위주로 요청함. 너무 화려하지 않게 부탁함.</p><p class="hand">리시안셔스 꽃말 문의함. 오래도록 변치 않는 사랑이라는 뜻도 있다고 안내함.</p><p class="hand">“안 변하는 게 꼭 좋은 건 아니잖아요.”라고 말함. 예상 밖의 반응이라 잠시 대답 못 함. 손님이 먼저 웃음.</p><p class="hand">“그래도 이건 좋네요.”</p><p class="hand">카드 작성 중 펜 두 번 바꿈. 첫 번째 카드는 구겨서 가져감. 작성 마친 뒤 혼자 웃음.</p>`;
const order2=`<p class="hand">은방울꽃 꽃말은 ‘다시 찾은 행복’이라고 안내함. 계절이 맞지 않아 별도 수급함.</p><p class="hand">“특별한 날인가 봐요?”라고 물으니 “그냥, 같이 연주하는 날입니다.”라고 답함.</p><p class="hand">앞선 주문과 주문자·수령인 이름이 서로 반대인 것 확인함. 두 주문 모두 수령인에게 사전 연락하지 말아 달라는 요청 있음.</p>`;
function header(n,title){return `<div class="overline">ARCHIVE OBJECT / ${n}</div><h2>${title}</h2>`}function pageNav(max){return `<div class="page-nav"><button id="prev" ${page===0?'disabled':''}>← 이전 장</button><span class="mono">${String(page+1).padStart(2,'0')} / ${String(max).padStart(2,'0')}</span><button id="next" ${page===max-1?'disabled':''}>다음 장 →</button></div>`}function receipt(which){let first=which===1;return header(first?'04':'05','꽃의 하루 · 주문 기록')+(!flipped?`<div class="receipt"><h2>꽃의 하루<br><small>FLEUR DU JOUR</small></h2><p style="text-align:center">ORDER ${first?'R-1024-017':'R-1024-021'}</p><div class="rline"><span>접수</span><span>공연 3일 전 ${first?'15:20':'16:05'}</span></div><div class="rline"><span>주문자</span><span>${first?'강비오':'최정요'}</span></div><div class="rline"><span>수령인</span><span>${first?'최정요':'강비오'}</span></div><div class="rline"><span>구성</span><span>${first?'흰 리시안셔스 · 유칼립투스':'파란 물망초 · 은방울꽃'}</span></div><div class="rline"><span>규격</span><span>중형 · 내추럴</span></div><div class="rline flower-meaning"><span>꽃말</span><span>${first?'리시안셔스 — 변치 않는 사랑<br>유칼립투스 — 추억, 기억':'물망초 — 나를 잊지 말아요<br>은방울꽃 — 다시 찾은 행복'}</span></div><hr><div class="rline"><b>TOTAL</b><b>₩${first?'98,000':'102,000'}</b></div><p>요청사항<br>${first?'“카드는 제가 직접 쓸게요. 꽃다발에 달아주세요.”<br>“받는 사람한테는 미리 연락하지 말아주세요.”':'“공연이 끝난 뒤 직접 전달하겠습니다.”<br>“포장은 단정하게 부탁드립니다.”<br>“받는 사람에게 미리 연락하지 말아주세요.”'}</p></div>`:`<div class="reverse" style="display:block;text-align:left"><p class="sub">직원 메모 · 영수증 뒷면</p>${first?order1:order2}</div>`)+`<button class="action" id="flip">${flipped?'↶ 영수증 앞면':'↻ 영수증 뒤집기'}</button>`}
function render(){let h='';switch(current){case'ticket':h=header('01','공연 티켓')+(!flipped?`<div class="reverse"><div><div class="mono">ADMIT ONE · CLASSICAL PERFORMANCE</div><h2 style="font:36px Georgia,serif;margin:20px 0">THE RETURN</h2><p>강비오 × 최정요</p><hr><p class="mono">19:00 / R석 / 1층 B블록 12열 08번</p><p class="sub">2030.10.30 · 7:00 PM</p></div></div>`:`<div class="reverse"><p class="hand">드디어 둘이 다시 같은 무대에 선다.</p></div>`)+`<button class="action" id="flip">↻ ${flipped?'앞면 보기':'티켓 뒤집기'}</button>`;break;case'programme':h=header('02','공식 프로그램북')+pages[page]+pageNav(pages.length);break;case'notes':h=header('03','관객의 현장 노트')+`<p class="sub">B블록 12열 08번 · 공연 중 키워드 기록 · 인터미션 및 종연 직후 보충</p>`+notePages[page]+pageNav(notePages.length);break;case'receipt1':h=receipt(1);break;case'receipt2':h=receipt(2);break;case'envelope':h=header('06','유실물 보관 봉투')+`<div class="flex"><span class="mono">LF-008 · 21:26</span><span class="stamp">보관 중 · 미인계</span></div><p class="sub">발견 장소: 무대 우측 출입 복도<br>보관물: 소형 메시지 카드 1점 / 꽃다발 리본 부착</p><div class="envelope-scene ${opened?'is-open':''} ${extracted?'is-extracted':''}"><div class="env-shadow"></div><div class="env-back"></div><div class="env-letter ${cardFlip?'is-flipped':''}" id="letter" role="button" tabindex="0" aria-label="메시지 카드 ${cardFlip?'앞면':'뒷면'} 보기"><div class="letter-face letter-front"><span class="letter-small">MESSAGE CARD</span><span class="letter-words">최정요에게.</span></div><div class="letter-face letter-back"><span class="letter-words">공연이 끝나면,<br>내가 먼저.</span><span class="letter-sign">— 강비오</span></div></div><div class="env-pocket"></div><div class="env-flap"></div><div class="env-seal">LF<br>008</div><div class="env-caption">VENUE OPERATIONS · LOST PROPERTY</div></div><div class="envelope-actions"><button class="action" id="envelopeBtn">${!opened?'봉투 열기':!extracted?'카드 꺼내기':!cardFlip?'카드 뒤집기':'처음부터 다시 보기'}</button></div><p class="sub envelope-help">${!opened?'봉투 안에 작은 카드가 들어 있습니다.':!extracted?'접힌 덮개 안으로 카드가 보입니다.':!cardFlip?'카드 앞면 · 최정요에게.':'카드 뒷면'}</p>`;break;case'score':h=header('07','Sonatina · BWV 106')+`<p class="mono">J. S. BACH / ACTUS TRAGICUS<br>TWO-HANDS ARRANGEMENT · COPY 02 · P.04</p><p class="sub">최정요 — Left Hand / 강비오 — Right Hand</p><div class="score-lines"><span class="score-note" style="top:30px;left:7%;transform:rotate(-3deg);font-size:19px;line-height:1.35;max-width:92%">마지막도 같이. 두 손으로 끝내자. — 비오</span><span class="score-note" style="top:112px;right:5%;transform:rotate(2deg);font-size:19px;line-height:1.35;max-width:92%">끝에서는 소리를 덜어내야 해. 왼손만. — 정요</span></div><p>아래 회색 영역을 손가락으로 문질러 희미한 연필 메모를 확인하세요.</p><div class="scratch"><span>한 번 더. &nbsp; — 정요</span><canvas id="scratchCanvas" aria-label="문질러서 메모 드러내기"></canvas></div><button class="action" id="revealScratch">연필 메모 바로 보기</button>`;break;case'log':h=header('08','공연 종료 후 운영 일지')+`<section class="operations-form"><div class="operations-top"><div><span class="operations-kicker">THE RETURN / STAGE MANAGEMENT</span><h3>공연 종료 후 운영 기록</h3></div><span class="operations-doc">SM–08</span></div><div class="operations-meta"><span>구분 <b>야간 운영</b></span><span>작성 부서 <b>무대 운영팀</b></span></div><div class="operations-head"><span>시각</span><span>조치 및 확인 사항</span></div><div class="staff-log">${[['21:04','커튼콜 종료. 출연진 무대 퇴장.'],['21:12','백스테이지 출입 복도 이동 확인.'],['21:26','무대 우측 출입 복도 유실물 발견, 운영팀 인계.'],['21:31','객석 퇴장 완료. 하우스 조명 소등.'],['21:38','무대 내 피아노 사용 확인. 사전 승인된 추가 리허설 또는 앙코르 일정 없음. 출연진 측 별도 요청사항 확인되지 않음.'],['21:43','피아노 소리 중단.'],['21:51','무대 최종 소등 및 출입 통제.']].map(([t,d])=>`<div class="entry ${t==='21:38'?'emphasis':''}"><time>${t}</time><span>${d}</span></div>`).join('')}</div><div class="operations-bottom"><span>후속 확인</span><span>피아노 덮개 복구 — 익일 오전 확인 예정</span></div><div class="operations-foot">공연장 내부 운영 기록 · 외부 배포용 아님</div></section>`;break;case'final':h=`<div class="final-record"><div class="eyebrow">UNREGISTERED RECORD / 09</div><h2 style="margin-top:30px">21:38 이후의 무대 기록</h2><p>공식 기록에 남지 않은 시간.</p><div class="final-prose"><p class="final-prose-p">수 년의 공백이 믿기지 않을 정도로 완벽한 공연이었다. 관객들의 박수갈채가 이어졌다. 두 사람은 서로를 아주 오랫동안 쳐다보았다. 앙코르는 없었다.</p><p class="final-prose-p">관객이 모두 떠나고, 공연 관계자와 직원들이 정리를 마쳤다. 무대 위는 방금까지 아름다운 선율이 울려퍼졌던 것이 꿈이었던 것처럼 고요했다. 깜깜한 무대에 핀 조명이 켜졌다. </p><p class="final-prose-p">&quot;그러게, 내 말이 맞지? 칸타타는 낮은 음 하나로 끝내야 돼.&quot;<br>&quot;알았다고. 하여간 뒤끝은.&quot;</p><p class="final-prose-p">정요가 비오의 손을 잡고 피아노 앞으로 이끌었다. 피아노 의자 왼편에 앉은 정요가 비오에게 손짓했다.</p><p class="final-prose-p">&quot;뭐해? 얼른 앉아.&quot;</p><p class="final-prose-p">비오가 웃으면서 자리에 앉았다. 건반 위에 정요의 왼손과, 비오의 오른손이 나란히 얹어졌다. 그리고 두 사람만의 앙코르 공연이 시작되었다.</p><div class="music-interlude" aria-label="음악이 흐른다">𝄞 &nbsp; ♪ ♫ ♪ &nbsp; 𝄢</div><p class="final-prose-p">두 사람은 음악 속으로 빠져들었다. 하나의 연주에 열일곱의 둘, 스물일곱의 둘, 그리고 서른하나의 둘의 장면이 겹쳐졌다.</p><p class="final-prose-p">마지막 음에 대한 논쟁은 더 이상 의미 없었다. 음악의 완결성도, 연주의 조화로움도 뒷전이었다. 지금은 오로지 서로만이 중요했다.</p><p class="final-prose-p">상의할 필요도 없었다. 어떻게 쳐야 할지 둘은 이미 알고 있었다. 정요의 왼손과 비오의 오른손이 함께 머물다가 동시에 건반을 떠났다. 두 음이 한데 섞여 두 사람을 감싸안았다.</p><p class="final-prose-p">그렇게 끝.</p><p class="final-prose-p">다정한 눈빛으로 서로의 눈동자를 바라보던 시선이 입술을 향했다. 무대 위에서 입을 맞추고 싶다는 비오의 고백에, 로맨틱한 로망이라고 놀려댄 적이 있었다. 그것이 무색하게 정요의 심장이 쿵쿵 뛰었다.  </p><p class="final-prose-p">&quot;너 얼굴 빨개졌어.&quot;<br>&quot;...나도 알아.&quot;</p><p class="final-prose-p">정요가 장난스레 웃는 비오의 얼굴을 끌어당겼다. 비오가 먼저 정요의 입술에 자신의 입술을 포갰다. 공연은 끝났지만, 새로운 음악이 시작되었다.</p></div><p class="finish">이 기록은 보관되지 않았습니다.</p></div>`;break}$('#content').innerHTML=h;$('#modal').scrollTop=0;$('#flip')?.addEventListener('click',()=>{flipped=!flipped;render()});$('#prev')?.addEventListener('click',()=>{page=Math.max(0,page-1);render()});$('#next')?.addEventListener('click',()=>{page=Math.min(current==='notes'?notePages.length-1:7,page+1);render()});$('#envelopeBtn')?.addEventListener('click',()=>{if(!opened)opened=true;else if(!extracted)extracted=true;else if(!cardFlip)cardFlip=true;else{opened=false;extracted=false;cardFlip=false}render()});$('#letter')?.addEventListener('click',()=>{if(extracted){cardFlip=!cardFlip;render()}});$('#letter')?.addEventListener('keydown',e=>{if(extracted&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cardFlip=!cardFlip;render()}});if(current==='score')initScratch()}
function openItem(id){current=id;page=0;flipped=false;opened=false;extracted=false;cardFlip=false;$('#overlay').classList.remove('hidden');document.body.style.overflow='hidden';if(id!=='final'&&!visited.has(id)){visited.add(id);document.querySelector(`[data-id="${id}"]`)?.classList.add('done');$('#counter').textContent=`RECORDS ${String(visited.size).padStart(2,'0')} / 08`;if(visited.size===8)setTimeout(()=>{$('#discovery').classList.remove('hidden')},700)}render()}
function close(){current=null;$('#overlay').classList.add('hidden');document.body.style.overflow='';}$('#enter').onclick=()=>{$('#intro').classList.add('hidden')};document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openItem(el.dataset.id));$('#close').onclick=close;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(current==='programme'||current==='notes'){if(e.key==='ArrowRight'&&$('#next')&&!$('#next').disabled)$('#next').click();if(e.key==='ArrowLeft'&&$('#prev')&&!$('#prev').disabled)$('#prev').click()}});$('#openFinal').onclick=()=>{$('#discovery').classList.add('hidden');openItem('final')};function initScratch(){let c=$('#scratchCanvas'),ctx=c.getContext('2d'),r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);ctx.fillStyle='#b0a89a';ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='#6f675d';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('문질러서 지워보세요',r.width/2,r.height/2+4);let active=false,strokes=0;function erase(e){if(!active)return;let rect=c.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();strokes++;if(strokes>35)c.style.opacity='0'}c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);erase(e)};c.onpointermove=erase;c.onpointerup=()=>active=false;c.onpointercancel=()=>active=false;$('#revealScratch').onclick=()=>{c.style.opacity='0'}}
</script></body></html>
